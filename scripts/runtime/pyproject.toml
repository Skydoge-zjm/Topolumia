[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topolumia-collector"
version = "0.1.0"
description = "Durable native experiment log collection for Topolumia"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
wandb = ["wandb>=0.19,<0.32"]
tensorboard = ["tensorboard>=2.19,<2.22"]

[project.scripts]
topolumia-collector = "topolumia_collector.cli:main"

[tool.setuptools]
packages = ["topolumia_collector"]
py-modules = ["wandb_record_reader"]
