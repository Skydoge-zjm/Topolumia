name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run test:docs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:frontend
      - run: npm run test:release
      - run: npm run build
      - run: node scripts/testing/run-backend-tests.mjs
      - run: npm run release:source
      - run: node artifacts/github/topolumia/scripts/documentation/check-docs.mjs
      - run: npm audit --audit-level=high
