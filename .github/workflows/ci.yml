name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: Runner
        type: choice
        default: ubuntu-latest
        options: [ubuntu-latest, windows-latest]
      node:
        description: Node.js
        type: choice
        default: '22'
        options: ['22', '24']
      release:
        description: Verify source release and audit dependencies
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.os || 'ubuntu-latest' }}-${{ inputs.node || '22' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node || '22' }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run docs:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:frontend
      - run: npm run build
      - run: node scripts/testing/run-backend-tests.mjs
      - name: Verify source release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: npm run test:docs && npm run test:release && npm run release:source && node artifacts/github/topolumia/scripts/documentation/check-docs.mjs
      - name: Audit dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: npm audit --audit-level=high
