name: 功能建议 / Feature request
description: 说明研究场景、现有障碍和希望达到的结果。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        建议先描述遇到的研究问题，再讨论实现方式。相关方向和边界可参考 [产品总览](https://github.com/Skydoge-zjm/Topolumia/blob/main/docs/product/overview.md)。
        可以用中文或英文提交，不必提供完整设计方案。
  - type: textarea
    id: use_case
    attributes:
      label: 使用场景与障碍 / Use case and problem
      description: 谁在什么任务中遇到了什么问题？目前如何处理？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望达到的结果 / Desired outcome
      description: 用具体操作或前后例子说明，如何判断这个需求已满足？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案 / Alternatives
  - type: textarea
    id: scope
    attributes:
      label: 范围、约束与补充材料 / Scope and context
      description: 可补充截图、相关 issue、外部依赖、数据或权限约束。请勿附未公开研究内容或凭据。
