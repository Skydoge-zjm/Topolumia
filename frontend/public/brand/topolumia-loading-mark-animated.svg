<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="18" height="18" role="img" aria-labelledby="loadingTitle loadingDesc">
  <title id="loadingTitle">Topolumia loading mark</title>
  <desc id="loadingDesc">A compact animated Topolumia mark with a subtle pulsing gold center.</desc>
  <defs>
    <mask id="miniHorizMask" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="white" />
      <path d="M 24.5 28 L 32 20.5 L 47.5 20.5 L 47.5 35.5 L 32 35.5 Z" fill="black" />
    </mask>
    <mask id="miniVertMask" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="white" />
      <rect x="18" y="22.75" width="8" height="10.5" fill="black" />
    </mask>
  </defs>

  <rect
    x="6"
    y="8"
    width="52"
    height="20"
    rx="10"
    fill="none"
    stroke="#18181B"
    stroke-width="4.5"
    mask="url(#miniHorizMask)"
  >
    <animate
      attributeName="opacity"
      values="0.95; 0.35; 0.95"
      dur="1.5s"
      begin="0s"
      repeatCount="indefinite"
      calcMode="spline"
      keyTimes="0; 0.5; 1"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
    />
  </rect>

  <rect
    x="22"
    y="18"
    width="20"
    height="39"
    rx="10"
    fill="none"
    stroke="#18181B"
    stroke-width="4.5"
    mask="url(#miniVertMask)"
  >
    <animate
      attributeName="opacity"
      values="0.95; 0.35; 0.95"
      dur="1.5s"
      begin="0.45s"
      repeatCount="indefinite"
      calcMode="spline"
      keyTimes="0; 0.5; 1"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
    />
  </rect>

  <g transform="translate(32 28)">
    <path d="M 0 -4.5 L 4.5 0 L 0 4.5 L -4.5 0 Z" fill="#F59E0B">
      <animate
        attributeName="opacity"
        values="1; 0.2; 1"
        dur="1.5s"
        begin="0.2s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0; 0.5; 1"
        keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
      />
      <animateTransform
        attributeName="transform"
        type="scale"
        values="1.08; 0.78; 1.08"
        dur="1.5s"
        begin="0.2s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0; 0.5; 1"
        keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
      />
    </path>
  </g>
</svg>
